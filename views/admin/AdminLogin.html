
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Administrativo</title>

    <link rel="stylesheet" href="/css/AdminLogin.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
    <main class="container">
        <section class="panel">
            <div class="login-content">
                <h1>Login do Administrador</h1>
                <p>Acesse o painel administrativo</p>

                <form id="login">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope"></i>
                        <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password"required>
                        <i class="fa-regular fa-eye-slash password-icon"></i>
                    </div>

                    <button type="submit">Entrar</button>
                </form>
            </div>
        </section>
    </main>

    <script src="/js-admin/login.js"></script>
</body>
</html>
