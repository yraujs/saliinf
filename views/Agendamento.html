<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/Agendamento.css">
</head>
<body>
    <h1>Solicitar Agendamento</h1>
    <h2>Preencha os campos abaixo para solicitar um agendamento</h2>

    <div class="campos">
        <div>
            <label>Dia</label><br>
            <input type="date" id="dia">
        </div>
        <div>
            <label>Horário de início</label><br>
            <select id="horario-inicio">
                <option value="inicio-7:30h">7:30</option>
                <option value="inicio-8:20h">8:20</option>
                <option value="inicio-9:10h">9:10</option>
                <option value="inicio-10:00h">10:00</option>
                <option value="inicio-11:10h">11:10</option>
            </select>
        </div>
        <div>
            <label>Horário de Término</label><br>
            <select id="horario-termino">
                <option value="termino-8:20h">8:20</option>
                <option value="termino-9:10h">9:10</option>
                <option value="termino-10:00h">10:00</option>
                <option value="termino-11:10h">11:10</option>
                <option value="termino-12:00h">12:00</option>
            </select>
        </div>
        <div>
            <label>Laboratório</label><br>
            <select id="laboratorio"></select>
        </div>
        <div>
            <label>Atividade</label><br>
            <textarea id="atividade" placeholder="Descreva a atividade a ser realizada"></textarea>
        </div>
         <button id="enviar-solicitacao">Enviar Solicitação</button>
    </div>

    <script src="/js/agendamento.js" defer></script>
</body>
</html>
