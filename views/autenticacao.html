<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="/css/AutenticacaoStyle.css">
</head>
<body>
    <div class="container" id="container">
        
        <div class="form-container cadastro-container">
            <div class="cadastro">
                <h1>Crie sua Conta</h1>
                <input placeholder="Nome completo" id="name"><br>
                <input placeholder="E-mail institucional" id="email"><br>
                <input placeholder="senha" id="password" type="password"><br>
                <input placeholder="Confirmar senha" id="confirm-password" type="password"><br>
                <button id="btn-cadastro">Continuar</button>
            </div>
        </div>

        <div class="form-container login-container">
            <div class="login">
                <h1>Login</h1>
                <input placeholder="e-mail" id="email-login"><br>
                <input placeholder="senha" id="password-login"><br>
                <button id="btn-login">Entrar</button>
            </div>
        </div>

        <div class="overlay-container">
            <div class="overlay">
                <div class="overlay-panel overlay-left">
                    <h1>Bem-Vindo!</h1>
                    <span>Não possui conta?</span><br>
                    <button id="to-register">Cadastre-se</button>
                </div>
                <div class="overlay-panel overlay-right">
                    <h1>Bem-Vindo!</h1>
                    <span>Já possui conta?</span><br>
                    <button id="to-login">Login</button>
                </div>
            </div>
        </div>

    </div>

    <script src="/js/autenticacao.js"></script>
</body>
</html>
