
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda por Laboratório - SALIINF</title>
    <link rel="stylesheet" href="../public/css/AgendaLab.css">
</head>
<body>
    <header>
        <div class="header-esquerda">
            <img src="../public/img/logo saliinf.png" alt="Logo do Saliinf" width="100" height="100">
            <p><span>SALIINF</span><br>DAIC - IFAM CMC</p>
        </div>

        <nav>
            <ul>
                <li><a href="AgendaGeral.html" class="menu">Agenda</a></li>
                <li><a href="Sobre.html">Sobre</a></li>
                <li><a href="Ajuda.html">Ajuda</a></li>
            </ul>
        </nav>

        <div class="header-direita">
            <p>
                Sist. de Agendamento de <br>
                Laboratórios de Informática
            </p>
            <a href="Validacao-cadastro.html" class="botao-entrar">Entrar</a>
        </div>
    </header>

    <main>
        <div class="barra-agenda">
            <div class="controle-data">
                <div class="campo-data">
                    <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="5" width="18" height="16" rx="2"/>
                        <path d="M7 2v6M17 2v6M3 10h18"/>
                    </svg>
                    <input type="date" id="data-agenda" value="2026-09-02">
                </div>
                <button class="botao-hoje" type="button">Hoje</button>
            </div>

            <div class="controle-laboratorio">
                <div class="alternar-visualizacao">
                    <a href="AgendaGeral.html" class="aba">Geral</a>
                    <a href="AgendaLaboratorioPublica.html" class="aba ativa">Por laboratório</a>
                </div>

                <div class="seletor-laboratorio">
                    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="4" width="18" height="13" rx="1"/>
                        <path d="M8 21h8M12 17v4"/>
                    </svg>

                    <select id="laboratorio" aria-label="Selecionar laboratório">
                        <option value="1">Laboratório 1</option>
                        <option value="2">Laboratório 2</option>
                        <option value="3" selected>Laboratório 3</option>
                        <option value="4">Laboratório 4</option>
                        <option value="5">Laboratório 5</option>
                        <option value="6">Laboratório 6</option>
                        <option value="7">Laboratório 7</option>
                    </select>
                </div>
            </div>

    </main>
</body>
</html>
